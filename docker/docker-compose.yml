name: cloudburst

services:
  cloudburst:
    build:
      context: ../
      dockerfile: docker/Dockerfile
    image: cloudburstmc/server:latest
    container_name: cloudburst
    ports:
      - "19132:19132/udp"
    volumes:
      - cloudburst-data:/data
    stdin_open: true
    tty: true
    restart: unless-stopped

volumes:
  cloudburst-data:
