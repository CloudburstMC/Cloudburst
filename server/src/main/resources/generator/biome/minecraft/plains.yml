
elevationVanilla:
  height: 0.125
  variation: 0.05

decorators:
  - id: "cloudburst:surface"
    top: "grass_block"
    filler: "dirt"

populators:
    # Tall grass
  - id: "cloudburst:shrub"
    chance: 0.0390625 # about 10 per chunk
    on: "grass_block"
    block: "short_grass"

  - id: "cloudburst:noise"
    selector:
      id: "cloudburst:simplex"
      scale: 0.005
      octaves: 1
    threshold: -0.8
    above:
        # Double tall grass
      - id: "cloudburst:double_plant"
        chance: 0.02734375 # about 7 per chunk
        on: "grass_block"
        type: 2

        # Flowers
      - id: "cloudburst:shrub"
        chance: 0.015625 # about 4 per chunk
        on: "grass_block"
        replace: "air,short_grass"
        roundDown: false
        block:
          - "red_tulip"
          - "orange_tulip"
          - "white_tulip"
          - "pink_tulip"
          - "azure_bluet"
          - "oxeye_daisy"
          - "cornflower"
    below:
        # Flowers
      - id: "cloudburst:shrub"
        chance: 0.05859375 # about 15 per chunk
        on: "grass_block"
        replace: "air,short_grass"
        roundDown: false
        block:
          - "red_tulip"
          - "orange_tulip"
          - "white_tulip"
          - "pink_tulip"
          - "azure_bluet"
          - "oxeye_daisy"
          - "cornflower"

    # Oak trees
  - id: "cloudburst:tree"
    chance: 0.0001953125 # about 1 per 20 chunks
    on: "grass_block"
    replace: "air,short_grass"
    type: "oak"
