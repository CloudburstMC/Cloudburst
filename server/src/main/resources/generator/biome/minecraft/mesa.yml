
elevationVanilla:
  height: 0.1
  variation: 0.05

decorators:
  - id: "cloudburst:height"
    seed: "mesa_surface"
    threshold:
      id: "cloudburst:simplex"
      scale: 0.0045
      octaves: 4
    additionalOffset: 8.0
    addSeaLevelToOffset: true
    below:
        # Plain old mesa surface
      - id: "cloudburst:surface"
        top: "red_sand"
        filler: "orange_terracotta"
    above:
        # Generate clay layers
      - id: "cloudburst:mesa_surface"
        bandOffset:
          id: "cloudburst:simplex"
          scale: 0.001953125 # 1/512
          octaves: 4
          factor: 2.0
        base: "hardened_clay"
        bands:
          - count: 21
            block: "orange_terracotta"
          - count: "2-5"
            size: "1-3"
            block: "yellow_terracotta"
          - count: "2-5"
            size: "2-4"
            block: "brown_terracotta"
          - count: "2-5"
            size: "1-3"
            block: "red_terracotta"
          - count: "3-5"
            block: "white_terracotta"
            above: "light_gray_terracotta"
            below: "light_gray_terracotta"

populators:
    # Dead bushes
  - id: "cloudburst:shrub"
    chance: 0.078125 # about 20 per chunk
    patchSize: 4
    on:
      - "red_sand"
      - "hardened_clay"
      - "white_terracotta"
      - "orange_terracotta"
      - "yellow_terracotta"
      - "light_gray_terracotta"
      - "brown_terracotta"
      - "red_terracotta"
    block: "deadbush"

    # Cactus
  - id: "cloudburst:plant"
    chance: 0.01953125 # about 5 per chunk
    patchSize: 10
    height: "1-3"
    on: "red_sand"
    block: "cactus"

    # Sugar cane
  - id: "cloudburst:plant"
    chance: 0.01171875 # about 3 per chunk
    patchSize: 20
    height: "1-3"
    on: "sand,red_sand"
    water: "water"
    block: "reeds"

    # Gold
  - id: "cloudburst:ore"
    chance: 0.078125 # about 20 per chunk
    size: 9
    height: "32-80"
    block: "gold_ore"
    replace: "stone"
