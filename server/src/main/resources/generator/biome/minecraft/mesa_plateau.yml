parent: "minecraft:mesa"

elevationVanilla:
  height: 1.525
  variation: 0.025

decorators:
  - id: "cloudburst:next"

  - id: "cloudburst:noise"
    selector:
      id: "cloudburst:simplex"
      scale: 0.015625
      octaves: 4
    threshold: 0.0
    above:
      - id: "cloudburst:noise"
        selector:
          id: "cloudburst:simplex"
          scale: 0.0045
          octaves: 4
        threshold: 0.0
        above:
          - id: "cloudburst:replace_top"
            height: "86-255"
            replace:
              - "hardened_clay"
              - "white_terracotta"
              - "orange_terracotta"
              - "yellow_terracotta"
              - "light_gray_terracotta"
              - "brown_terracotta"
              - "red_terracotta"
            block: "grass_block"
        below:
          - id: "cloudburst:replace_top"
            height: "86-255"
            replace:
              - "hardened_clay"
              - "white_terracotta"
              - "orange_terracotta"
              - "yellow_terracotta"
              - "light_gray_terracotta"
              - "brown_terracotta"
              - "red_terracotta"
            block: "coarse_dirt"

populators:
  - id: "cloudburst:next"

    # Trees
  - id: "cloudburst:tree"
    chance: 0.01953125 # about 5 per chunk
    on: "grass_block,coarse_dirt"
    type: "oak"

    # Tall grass
  - id: "cloudburst:shrub"
    chance: 0.00390625 # about 1 per chunk
    on: "grass_block,coarse_dirt"
    block: "short_grass"
