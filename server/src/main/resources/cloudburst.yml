# %header.1
# %header.2
# %header.3

settings:
  # %settings.language
  language: "%language"
  # %settings.force-language
  force-language: false
  # %settings.shutdown-message
  shutdown-message: "Server closed"
  # %settings.query-plugins
  query-plugins: true
  # %settings.deprecated-verbose
  deprecated-verbose: true
  # %settings.async-workers.1
  # %settings.async-workers.2
  async-workers: auto
  # %settings.upnp
  upnp: false

network:
  # %network.batch-threshold.1
  # %network.batch-threshold.2
  batch-threshold: 256
  # %network.compression-level
  compression-level: 7
  # %network.async-compression
  async-compression: false

debug:
  # %debug.level
  level: 1
  # %debug.commands
  commands: false
  ignored-packets:
    - "LevelChunkPacket"

timings:
  # %timings.enabled
  enabled: false
  # %timings.verbose
  verbose: false
  # %timings.history-interval.1
  # %timings.history-interval.2
  history-interval: 6000
  # %timings.history-length.1
  # %timings.history-length.2
  # %timings.history-length.3
  history-length: 72000
  # %timings.bypass-max.1
  # %timings.bypass-max.2
  # %timings.bypass-max.3
  bypass-max: false
  # %timings.privacy
  privacy: false
  # %timings.ignore.1
  # %timings.ignore.2
  ignore: []

level-settings:
  # %level-settings.default-format
  default-format: leveldb
  # %level-settings.auto-tick-rate
  auto-tick-rate: true
  auto-tick-rate-limit: 20
  # %level-settings.base-tick-rate
  base-tick-rate: 1
  # %level-settings.always-tick-players
  always-tick-players: false

chunk-sending:
  # %chunk-sending.per-tick
  per-tick: 4
  # %chunk-sending.max-chunk-radius
  max-chunk-radius: 48
  # %chunk-sending.spawn-threshold
  spawn-threshold: 56
  # %chunk-sending.cache-chunks.1
  # %chunk-sending.cache-chunks.2
  cache-chunks: false

chunk-ticking:
  # %chunk-ticking.per-tick
  per-tick: 40
  # %chunk-ticking.tick-radius
  tick-radius: 3
  light-updates: false
  clear-tick-list: false

chunk-generation:
  # %chunk-generation.queue-size
  queue-size: 8
  # %chunk-generation.population-queue-size
  population-queue-size: 8

ticks-per:
  animal-spawns: 400
  monster-spawns: 1
  autosave: 6000
  cache-cleanup: 900

# %spawn-limits
spawn-limits:
  monsters: 70
  animals: 15
  water-animals: 5
  ambient: 15

player:
  # %player.save-player-data.1
  # %player.save-player-data.2
  save-player-data: true
  # %player.skin-change-cooldown
  skin-change-cooldown: 30
  # %player.log-player-addresses
  log-player-addresses: true

movement:
  # How many ticks of movement history to retain for server-side rewind
  # corrections. 40 ticks covers a 2-second round trip at 20 tps.
  rewind-history-size: 40
  # Maximum distance (blocks) a player may claim to have moved in a single
  # input packet before the position is rejected outright.
  max-position-delta: 50.0
  # Speed cap in blocks squared per tick squared. Moves exceeding this
  # rate are reverted. Gliding and active flight are exempt.
  max-speed-threshold: 20.0
  # When true, the speed cap is halved and corrections are sent more
  # frequently. Useful for stricter anti-cheat at the cost of more
  # corrections on high-latency connections.
  strict-movement: false
  # Distance (blocks) the player position may differ from the authoritative
  # position before a correction is sent. Values above 1.0 increase the
  # risk of accepting invalid positions.
  position-acceptance-threshold: 0.5
  # When true, the player dismount position is strictly corrected on
  # high-latency connections.
  strict-dismount: false

interaction:
  # When true, entity interaction packets are validated more strictly.
  strict-entity-interactions: false
  # Maximum angle difference (0 to 1) between look direction and attack
  # direction. 0 allows up to 90 degrees of divergence; 1 requires an
  # exact match.
  attack-direction-threshold: 0.85
  # Multiplier applied to the server-side block-breaking reach distance.
  # Values above 1.0 give players extra reach tolerance.
  block-break-reach-scalar: 1.5

level:
  # Maximum number of scheduled block ticks executed per game tick.
  # Capping this prevents TPS spikes during heavy redstone while still ensuring
  # all delayed ticks fire; excess ticks carry over to the next game tick.
  max-block-ticks: 65536
  # Maximum number of scheduled liquid ticks executed per game tick.
  # Excess ticks carry over to the next game tick.
  max-liquid-ticks: 65536
  # Tick delay for water when lava is horizontally adjacent.
  water-over-lava-flow-speed: 5
  # Maximum number of chained neighbor-update callbacks that may fire from a
  # single block change before the chain is cut and a warning is logged.
  # Prevents runaway update loops from overflowing the call stack.
  # Set to -1 to disable the cap.
  max-chained-neighbor-updates: 1000000

# %aliases
aliases:
#  showtheversion: version
#  savestop: [save-all, stop]

# %worlds
worlds:
  world:
    generator: cloudburst:standard
    options: overworld
    # max-liquid-ticks: 65536
    # water-over-lava-flow-speed: 5
  nether:
    generator: cloudburst:standard
    options: nether
  the_end:
    generator: cloudburst:standard
    options: the_end
