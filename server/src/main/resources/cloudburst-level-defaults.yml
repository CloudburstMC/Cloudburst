# Shared defaults for all levels. Per-level files contain only overrides.
# Override these values in cloudburst-level.yml inside a level's data directory.
config-version: 1

level:
  # Scheduled work beyond these budgets carries over to a later tick.
  max-block-ticks: 65536
  max-liquid-ticks: 65536
  water-over-lava-flow-speed: 5
  # Set to -1 to disable the neighbor-update limit.
  max-chained-neighbor-updates: 1000000

chunk-ticking:
  # %chunk-ticking.tick-radius
  tick-radius: 3
  # %chunk-ticking.per-tick
  per-tick: 40
  light-updates: false
  clear-tick-list: false

chunk-sending:
  # %chunk-sending.per-tick
  per-tick: 4
  # Maximum chunk radius a player may request.
  max-chunk-radius: 48
  max-loaded-chunk-radius: 10
  # %chunk-sending.spawn-threshold
  spawn-threshold: 56
  # %chunk-sending.cache-chunks.1
  # %chunk-sending.cache-chunks.2
  cache-chunks: false

# %spawn-limits
spawn-limits:
  monsters: 70
  animals: 15
  water-animals: 5
  ambient: 15
