name: Bug Report
description: File a bug report for Cloudburst.
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        **Before submitting**, please make sure:
        - The bug is reproducible on the **latest build** of Cloudburst
        - You are running a **clean server** (no plugins, unless the bug is plugin-related)
        - There is no existing issue for this bug

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Reliable steps someone can follow to reproduce the issue. Do not submit reports for non-reproducible bugs.
      placeholder: |
        1. Start the server with...
        2. Connect a client and...
        3. Observe that...
    validations:
      required: true

  - type: textarea
    id: debug-paste
    attributes:
      label: Debug Report
      description: Run `debugpaste` in the console after reproducing the issue and paste the link here. Review the public report for sensitive information before sharing.
      placeholder: 'https://mclo.gs/aBcDeFg'
    validations:
      required: true

  - type: input
    id: timings
    attributes:
      label: Timings Paste
      description: If the bug is performance-related (lag, TPS drops, slow startup), run `/timings paste` and paste the link here.
      placeholder: 'http://timings.aikar.co/aBcDeFgHiJ'
    validations:
      required: false

  - type: textarea
    id: crashdump
    attributes:
      label: Crashdump, Backtrace or Other Files
      description: Paste any relevant crash dumps, stack traces, or logs. Use https://gist.github.com for large files and paste the link here.
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched for existing issues and this is not a duplicate
          required: true
